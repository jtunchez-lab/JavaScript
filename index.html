<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
</head>
<body>

    <h1>Hello, World!</h1>
    <button id="ClickButton">Increase</button>
    <button id = "DecreaseButton">Decrease</button>
    <button id = "Reset">Reset</button>
    
    <p id="ScoreText">0</p>
    
    <section>
        <button id = "ReRollButton">ReRoll Animal</button>
        <p id ="AnimalText"></p>
        
    </section>
    <script>
        let Score = 0;
        let Animals = ["Panda", "Polar Bear", "Whale","Wolverine"];
        
        document.getElementById("ClickButton").addEventListener("click", function() {
            Score = Score +1;
            document.getElementById("ScoreText").textContent = Score;
        });
         document.getElementById("DecreaseButton").addEventListener("click", function() {
             Score = Score-1
            document.getElementById("ScoreText").textContent =Score ;
        });
        document.getElementById("Reset").addEventListener("click", function() {
             Score = 0
            document.getElementById("ScoreText").textContent =Score ;
        });

        document.getElementById("ReRollButton").addEventListener("click", function() {
             let RandomNumber = Math.floor(Math.random()* Animals.length);
             let RandomAnimal = Animals[RandomNumber];
                if (RandomAnimal === "Panda") {
                 document.getElementById("AnimalText").textContent = RandomAnimal + "(My Favorite Animal)" ;
                } else {
                document.getElementById("AnimalText").textContent =RandomAnimal;
                    
                }
            
            
        });
       
    </script>
</body>
</html>
